name: tests
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"      # not available on Ubuntu 26.04 (ubuntu-latest since Oct 2026)
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: python -m pytest -q
